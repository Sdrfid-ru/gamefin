name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PROPERTIES_BASE64: ${{ secrets.ANDROID_SIGNING_PROPERTIES_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$SIGNING_PROPERTIES_BASE64" ]]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64 and ANDROID_SIGNING_PROPERTIES_BASE64 in repository Actions secrets."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          printf '%s' "$SIGNING_PROPERTIES_BASE64" | base64 --decode > signing.properties
      - name: Test and build signed release
        run: >-
          ./gradlew checkKotlinFormat :app:lintRelease :app:testDebugUnitTest
          :core:domain:test :backend:test :app:assembleRelease
          --no-configuration-cache --stacktrace
      - name: Remove signing files
        if: always()
        run: rm -f release-keystore.jks signing.properties
      - name: Verify and package APK
        id: package
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          mkdir -p dist
          cp "$apk" dist/gamefin-release.apk
          (cd dist && sha256sum gamefin-release.apk > gamefin-release.apk.sha256)
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("app/build/outputs/apk/release/output-metadata.json").read_text())
          apk = metadata["elements"][0]
          version = apk["versionName"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          Path("dist/release-notes.md").write_text(
              "Подписанный релизный APK для Android 8.0 и новее.\n\n"
              f"Версия: {version} (versionCode {apk['versionCode']}).\n\n"
              f"Коммит: {os.environ['GITHUB_SHA']}.\n\n"
              "Скачайте `gamefin-release.apk`. Файл `gamefin-release.apk.sha256` "
              "содержит контрольную сумму для проверки загрузки.\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-apk-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-apk
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="build-$GITHUB_RUN_ID"
          title="FinDrug $APP_VERSION build $GITHUB_RUN_NUMBER"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft \
              --title "$title" --notes-file dist/release-notes.md
          fi
          gh release upload "$tag" dist/gamefin-release.apk dist/gamefin-release.apk.sha256 --clobber
          # An older build finishing later must not replace the latest main release.
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          latest=false
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then latest=true; fi
          gh release edit "$tag" --draft=false --latest="$latest" \
            --title "$title" --notes-file dist/release-notes.md
          gh release view "$tag" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
