name: Release artifact

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-37.0" "platforms;android-37.2" "build-tools;36.0.0"
      - run: ./gradlew checkKotlinFormat :app:lintDebug :app:testDebugUnitTest :core:domain:test :backend:test :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: findrug-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

# Signing and AAB publication are intentionally not configured until the release owner
# supplies a RuStore signing key and repository secrets through GitHub settings.
